<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Local-only renderer: no remote content is ever loaded, Node is disabled, and the
      context is isolated. 'unsafe-inline' is required for Vite's dev React-refresh preamble.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
